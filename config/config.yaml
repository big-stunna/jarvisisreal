# J.A.R.V.I.S. Core Configuration
llm:
  default_provider: nvidia
  models:
    fast: meta/llama-3.3-70b-instruct
  # Ordered fallback chain — exhausts each quota before moving on
  fast_fallbacks:
    - provider: nvidia
      model: nvidia/llama-3.1-nemotron-70b-instruct   # 1000 req/month
    - provider: nvidia
      model: meta/llama-3.1-8b-instruct               # 1000 req/month
    - provider: openrouter
      model: meta-llama/llama-3.3-70b-instruct:free   # OpenRouter free tier
    - provider: openrouter
      model: mistralai/mistral-7b-instruct:free        # another free bucket
    code: claude-3-5-sonnet
    vision: gemini-3.5-flash
    vision_fallback: gemini-3.1-flash-lite   # used only if the main vision model is busy (429/503)
    vision_offline: gemma3:4b           # local vision model used in offline mode
    offline: qwen2.5:7b

# Token savers (measured): low = ~264 tokens per image vs ~1100 default;
# minimal thinking = 0 thinking tokens. Use medium if small text is misread.
gemini:
  media_resolution: low        # low | medium | high
  thinking_level: none         # none | minimal | low | medium | high (none = fastest, no thinking tokens)
  max_output_tokens: 1024

audio:
  stt_model: tiny
  tts_voice: en-GB-RyanNeural
  ducking_volume: 0.2

system:
  workspace_preset: default
